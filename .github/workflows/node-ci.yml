name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main
      - ravi_dev
  pull_request:
    branches:
      - main
      - ravi_dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v3

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🧪 Run tests
        run: npm test

      - name: 🏗️ Build Project
        run: npm run build || echo "No build script found, skipping"
        
      - name: 🚀 Deploy to Render
        run: curl -X POST ${{ 'a96daba95492330834062b26d26675b4' }}